
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAGOG Medical AI | Advanced Medical Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #E2E8F0;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-dark-bg: rgba(0, 0, 0, 0.7);
        }

        .light-theme {
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --glass-bg: rgba(15, 23, 42, 0.03);
            --glass-border: rgba(15, 23, 42, 0.08);
            --glass-dark-bg: rgba(255, 255, 255, 0.8);
        }

        .light-theme .glass {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 42, 0.12);
        }

        .light-theme .glass-dark {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(15, 23, 42, 0.15);
        }

        .light-theme .opacity-40 {
            opacity: 0.6 !important;
        }

        .light-theme .opacity-50 {
            opacity: 0.7 !important;
        }

        .light-theme .border-white\/5 {
            border-color: rgba(15, 23, 42, 0.08) !important;
        }

        .light-theme .border-white\/10 {
            border-color: rgba(15, 23, 42, 0.12) !important;
        }

        .light-theme .bg-white\/\[0\.02\] {
            background-color: rgba(15, 23, 42, 0.04) !important;
        }

        .light-theme .bg-white\/\[0\.03\] {
            background-color: rgba(15, 23, 42, 0.06) !important;
        }

        .light-theme .hover\:bg-white\/5:hover {
            background-color: rgba(15, 23, 42, 0.08) !important;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }
        
        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .glass-dark {
            background: var(--glass-dark-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .gradient-text {
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .light-theme ::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.1);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
